<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card — Sultanmuratov Shadiyar</title>

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="text-center mb-8">
        <h1 class="text-4xl font-bold">Sultanmuratov Shadiyar</h1>
        <p class="text-lg text-slate-500 mt-1">Aspiring Web Developer</p>
    </header>

    <main class="flex flex-col items-center">
        <section class="bg-white rounded-2xl p-6 max-w-md w-full
                        flex flex-col items-center
                        border-2 border-slate-200">
            <img src="/shadiyar.jpg" alt="Shadiyar"
                 class="w-24 h-24 rounded-full object-cover">

            <div class="flex flex-col items-center mt-4">
                <h2 class="text-2xl font-semibold mb-2">Sultanmuratov Shadiyar</h2>
                <p class="text-base text-slate-600 leading-relaxed mb-3 text-center">
                    Third-year IT Management student at KBTU.
                    Learning to build web and mobile applications.
                </p>

                <ul class="flex gap-4 list-none p-0 m-0">
                    <li><a href="mailto:sadiarsultanmuratov@gmail.com"
                           class="text-blue-600 no-underline hover:underline">Email</a></li>
                    <li><a href="https://github.com/sadiarsultanmuratov-kbtu"
                           class="text-blue-600 no-underline hover:underline">GitHub</a></li>
                </ul>

                <button id="likeBtn" class="like-btn">❤️ Like</button>
            </div>
        </section>
    </main>

    <footer class="text-center mt-10 text-slate-500 text-sm">
        <p>&copy; 2026 Sultanmuratov Shadiyar</p>
    </footer>

    <script>
        const btn = document.querySelector('#likeBtn');
        let liked = false;
        btn.addEventListener('click', () => {
            liked = !liked;
            if (liked) {
                btn.textContent = '💖 Liked!';
                btn.classList.add('is-liked');
            } else {
                btn.textContent = '❤️ Like';
                btn.classList.remove('is-liked');
            }
        });
    </script>

    <!-- Vite entry point — не удалять! -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
